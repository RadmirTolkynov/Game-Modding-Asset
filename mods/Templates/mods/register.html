<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация | Мод-Каталог</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121214; 
            color: #e0e0e6; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .register-container {
            background: #1a1a1e;
            border: 1px solid #2a2a30;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 400px;
        }

        h2 { 
            margin-top: 0; 
            margin-bottom: 24px; 
            color: #ffffff; 
            text-align: center;
        }

        /* Стилизация полей стандартной формы регистрации Django */
        .register-container p {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .register-container label {
            color: #b1b1b8;
            font-size: 0.9em;
        }

        .register-container input {
            background: #212126;
            border: 1px solid #30363d;
            padding: 10px 14px;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1em;
            transition: border-color 0.2s;
        }

        .register-container input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        /* Подсказки к паролю (Django UserCreationForm выводит их мелким текстом) */
        .register-container .helptext {
            font-size: 0.75em;
            color: #8b949e;
            line-height: 1.3;
            margin-top: 2px;
        }

        /* Список ошибок, если пароли не совпали или слишком простые */
        .errorlist {
            color: #ff7b72;
            list-style: none;
            padding: 0;
            margin: 0 0 10px 0;
            font-size: 0.85em;
        }

        .btn-submit {
            display: block;
            width: 100%;
            background: #238636;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 25px;
        }

        .btn-submit:hover {
            background: #2ea043;
        }

        .form-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9em;
            color: #8b949e;
        }

        .form-footer a {
            color: #58a6ff;
            text-decoration: none;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }
        
        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 0.85em;
            color: #8b949e;
            text-decoration: none;
        }
        .back-home:hover { color: #ffffff; }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>Создать аккаунт</h2>
        
        <form method="post">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <button type="submit" class="btn-submit">Зарегистрироваться</button>
        </form>

        <div class="form-footer">
            Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
        </div>
        
        <a href="{% url 'home' %}" class="back-home">← На главную</a>
    </div>

</body>
</html>
